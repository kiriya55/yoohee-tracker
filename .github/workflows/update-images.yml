name: Update Resource Images

on:
  workflow_dispatch:
    inputs:
      servers:
        description: "Comma-separated server codes"
        required: false
        default: "dw-cn,haoplay"
      sync_r2:
        description: "Upload generated mini-program images and index to R2"
        required: false
        default: true
        type: boolean
      refresh_dolls:
        description: "Refresh existing Dandegate doll images (normally only missing images are downloaded)"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "17 11 * * *"

concurrency:
  group: resource-sync-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SERVERS: ${{ github.event.inputs.servers || 'dw-cn,haoplay' }}
      SYNC_R2: ${{ github.event_name == 'schedule' || github.event.inputs.sync_r2 != 'false' }}
      REFRESH_DOLLS: ${{ github.event_name == 'workflow_dispatch' && inputs.refresh_dolls || false }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Initialize sync diagnostics
        run: |
          mkdir -p output
          cat > output/resource-sync-report.json <<'EOF'
          {
            "schemaVersion": 1,
            "status": "workflow_started",
            "stages": {}
          }
          EOF

      - name: Check for resource catalog changes
        id: check-banners
        run: |
          INDEX_FILE="public/images/resource-index.json"
          {
            echo "# Resource sync"
            echo ""
            echo "- Event: ${{ github.event_name }}"
            echo "- Servers: $SERVERS"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ github.event_name }}" = "schedule" ] && [ -f "$INDEX_FILE" ]; then
            set +e
            node scripts/update-resource-index.mjs --existing "$INDEX_FILE" --servers "$SERVERS" --check-only --check-timesets
            status=$?
            set -e
            if [ "$status" -gt 1 ]; then exit "$status"; fi
            if [ "$status" -eq 0 ]; then
              echo "should_update=true" >> "$GITHUB_OUTPUT"
              {
                echo ""
                echo "## :arrows_counterclockwise: Resource sync required"
                echo "Catalog, event timesets, rate-up signals, or a pending avatar requires refresh — running the full sync."
              } >> "$GITHUB_STEP_SUMMARY"
            else
              echo "should_update=false" >> "$GITHUB_OUTPUT"
              {
                echo ""
                echo "## :white_check_mark: No resource changes"
                echo "Catalog, event timesets, and rate-up signals are unchanged. Skipped image sync, i18n refresh, R2 upload and the auto-commit."
              } >> "$GITHUB_STEP_SUMMARY"
              echo "Catalog and timesets unchanged; skipping full sync."
            fi
          else
            echo "should_update=true" >> "$GITHUB_OUTPUT"
            {
              echo ""
              echo "## :arrows_counterclockwise: Full sync (manual dispatch)"
              echo "Manual workflow dispatch — running the full sync regardless of change detection."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "Forcing full sync (manual dispatch or missing existing index)."
          fi

      - name: Update resource index
        if: steps.check-banners.outputs.should_update == 'true'
        run: |
          node scripts/update-resource-index.mjs \
            --servers "$SERVERS" \
            --out-dir examples \
            --existing public/images/resource-index.json \
            --probe-images --probe-concurrency 24 --probe-timeout-ms 20000

      - name: Snapshot published resource index
        if: steps.check-banners.outputs.should_update == 'true'
        run: cp public/images/resource-index.json output/previous-resource-index.json

      - name: Promote the synced catalog
        if: steps.check-banners.outputs.should_update == 'true'
        run: |
          cp "examples/gf2-resource-index.$(echo "$SERVERS" | cut -d, -f1).json" public/images/resource-index.json

      - name: Download images
        id: download-images
        if: steps.check-banners.outputs.should_update == 'true'
        run: |
          set +e
          args=(
            --index public/images/resource-index.json \
            --out-dir public/images \
            --concurrency 8 --timeout-ms 30000 --retries 3 \
            --dandegate-concurrency 4 \
            --report-out output/download-report.json
          )
          if [ "$REFRESH_DOLLS" = "true" ]; then args+=(--force-dolls); fi
          node scripts/download-images.mjs "${args[@]}"
          status=$?
          set -e
          if [ "$status" -eq 2 ]; then
            # A pending source without a safe remote fallback still blocks the
            # candidate, so keep the last published index intact.
            echo "source_pending=true" >> "$GITHUB_OUTPUT"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Some upstream image sources are not published yet; keeping the previous production index."
            cp output/previous-resource-index.json public/images/resource-index.json
            exit "$status"
          elif [ "$status" -eq 0 ]; then
            echo "source_pending=false" >> "$GITHUB_OUTPUT"
            echo "ready=true" >> "$GITHUB_OUTPUT"
            node -e '
              const fs = require("node:fs");
              const report = JSON.parse(fs.readFileSync("output/download-report.json", "utf8"));
              const skipped = report.avatarPending ?? [];
              if (!skipped.length) process.exit(0);
              const lines = [
                "",
                "## :hourglass_flowing_sand: Doll avatars waiting on upstream publication",
                "These dolls are temporarily using their verified remote thumbnail. Their head avatars will be retried by scheduled syncs:",
                "",
                ...skipped.map((entry) => `- ${entry.code} (id ${entry.id}): ${entry.reason}${entry.pageUrl ? ` — ${entry.pageUrl}` : ""}`),
              ];
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
              console.log(`Doll avatars temporarily using remote fallbacks: ${skipped.map((entry) => entry.code).join(", ")}`);
            '
          else
            echo "source_pending=false" >> "$GITHUB_OUTPUT"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            cp output/previous-resource-index.json public/images/resource-index.json
            exit "$status"
          fi

      - name: Fetch i18n names from community sources
        if: success() && steps.check-banners.outputs.should_update == 'true' && steps.download-images.outputs.ready == 'true'
        run: |
          node scripts/fetch-i18n-names.mjs \
            --mode normal \
            --index public/images/resource-index.json \
            --existing-i18n src/i18n.json \
            --out src/i18n-names.json \
            --sources-out src/i18n-name-sources.json \
            --report-out output/name-update-report.json \
            --sources mcc,gfl2help,wikiru \
            --concurrency 8 --timeout-ms 20000

      - name: Merge i18n names into resource indexes
        if: success() && steps.check-banners.outputs.should_update == 'true' && steps.download-images.outputs.ready == 'true'
        run: |
          node scripts/merge-i18n-names.mjs \
            --index public/images/resource-index.json \
            --names src/i18n-names.json \
            --sources src/i18n-name-sources.json \
            --out public/images/resource-index.json \
            --app-i18n src/i18n.json

      - name: Persist final combined resource index
        if: success() && steps.check-banners.outputs.should_update == 'true' && steps.download-images.outputs.ready == 'true'
        run: cp public/images/resource-index.json "examples/gf2-resource-index.$(echo "$SERVERS" | cut -d, -f1).json"

      - name: Upload generated mini-program index artifact
        if: success() && steps.check-banners.outputs.should_update == 'true' && steps.download-images.outputs.ready == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: miniprogram-resource-index
          path: public/images/resource-index.json
          if-no-files-found: error

      - name: Validate generated names
        if: success() && steps.check-banners.outputs.should_update == 'true' && steps.download-images.outputs.ready == 'true'
        run: npm run i18n:validate-authoritative

      - name: Run tests and build
        if: success() && (steps.check-banners.outputs.should_update != 'true' || steps.download-images.outputs.ready == 'true')
        run: |
          npm test
          npm run build

      - name: Verify branch baseline before publish
        if: success() && steps.check-banners.outputs.should_update == 'true' && steps.download-images.outputs.ready == 'true'
        run: |
          git fetch origin "$GITHUB_REF_NAME"
          remote_sha="$(git rev-parse "origin/$GITHUB_REF_NAME")"
          if [ "$remote_sha" != "$GITHUB_SHA" ]; then
            echo "::error::Remote $GITHUB_REF_NAME moved from $GITHUB_SHA to $remote_sha; refusing to publish a stale candidate."
            exit 1
          fi

      - name: Upload mini-program resources to R2
        if: success() && env.SYNC_R2 == 'true' && steps.check-banners.outputs.should_update == 'true' && steps.download-images.outputs.ready == 'true'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
        run: |
          node scripts/sync-miniprogram-resources.mjs \
            --index public/images/resource-index.json \
            --image-root public/images \
            --artifact-path output/miniprogram-resource-artifact/miniprogram-resource-index.json \
            --public-base-url "$R2_PUBLIC_BASE_URL"

      - name: Upload sync report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: resource-sync-report
          path: |
            output/
            examples/gf2-resource-index.*.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Commit changes
        if: success() && steps.check-banners.outputs.should_update == 'true' && steps.download-images.outputs.ready == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Never transplant generated files from an old checkout onto a newer
          # branch tip. If main moved while this run was in progress, fail safe
          # and let a fresh run regenerate the candidate from the new baseline.
          git fetch origin "$GITHUB_REF_NAME"
          remote_sha="$(git rev-parse "origin/$GITHUB_REF_NAME")"
          if [ "$remote_sha" != "$GITHUB_SHA" ]; then
            echo "::error::Remote $GITHUB_REF_NAME moved from $GITHUB_SHA to $remote_sha; refusing to publish a stale candidate."
            exit 1
          fi
          git add examples/ public/images/ src/i18n-names.json src/i18n-name-sources.json src/i18n.json
          if git diff --staged --quiet; then
            echo "Synced but generated content is identical to what is already committed; nothing to push."
            {
              echo ""
              echo "## :heavy_minus_sign: Nothing to commit"
              echo "Sync ran, but the generated files are byte-identical to the committed ones (no timestamp churn) — no commit was created."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            git commit -m "chore: update resource images and i18n names ($SERVERS)"
            if ! git push origin "HEAD:$GITHUB_REF_NAME"; then
              echo "::error::The branch changed during publish; rerun the resource sync from the new tip."
              exit 1
            fi
            {
              echo ""
              echo "## :white_check_mark: Update committed and pushed"
              echo "- Commit: \`$(git rev-parse --short HEAD)\`"
              echo "- Message: \`chore: update resource images and i18n names ($SERVERS)\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
